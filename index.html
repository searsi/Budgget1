<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفظتي الذكية - Realtime Database</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #eef2ff; }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(199, 210, 254, 0.6); }
        .custom-shadow { box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.1); }
    </style>
</head>
<body class="text-slate-800 pb-28">

    <header class="bg-gradient-to-l from-indigo-600 to-blue-600 text-white p-5 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 bg-white/20 rounded-2xl flex items-center justify-center text-xl shadow-inner">💎</div>
                <div>
                    <h1 class="text-base font-extrabold tracking-wide text-white">محفظتي الذكية</h1>
                    <p id="current-date" class="text-[10px] text-indigo-100 font-medium"></p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" onclick="exportData()" title="تصدير البيانات" class="text-xs bg-white/20 hover:bg-white/30 text-white p-2 rounded-xl transition flex items-center gap-1 font-bold cursor-pointer">
                    <span>📥</span> تصدير
                </button>
                <div id="connection-status-box" class="flex items-center gap-1.5 text-[10px] bg-white/20 text-white border border-white/30 px-2.5 py-1.5 rounded-full font-bold">
                    <span id="connection-dot" class="w-2 h-2 rounded-full bg-amber-300 animate-pulse"></span> 
                    <span id="connection-text">جاري الاتصال...</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-5">

        <section class="relative overflow-hidden rounded-3xl bg-gradient-to-tr from-indigo-600 via-indigo-700 to-blue-600 p-6 text-white custom-shadow">
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
            <div class="relative z-10 space-y-4">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-medium text-indigo-100 tracking-wider">الرصيد الصافي (المتبقي حقيقةً)</span>
                    <button type="button" onclick="openEditBalanceModal()" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-xl backdrop-blur-md font-bold transition flex items-center gap-1.5 shadow-sm cursor-pointer">
                        <span>✏️</span> تعديل الرصيد الأساسي
                    </button>
                </div>
                <div>
                    <p id="net-balance" class="text-2xl font-black tracking-tight text-white mt-1">0 د.ع</p>
                    <p class="text-[10px] text-indigo-200 mt-0.5">الرصيد الأساسي: <span id="base-balance-text">0</span> د.ع</p>
                </div>

                <div class="space-y-1.5 pt-2 border-t border-white/20">
                    <div class="flex justify-between text-[11px]">
                        <span class="text-indigo-100 font-medium">ميزانية الشهر المحددة: <span id="budget-limit-text" class="font-bold">0</span> د.ع</span>
                        <button type="button" onclick="openBudgetModal()" class="text-indigo-200 hover:text-white underline text-[10px] cursor-pointer">تعديل السقف</button>
                    </div>
                    <div class="w-full bg-indigo-950/40 rounded-full h-2 overflow-hidden">
                        <div id="budget-progress-bar" class="bg-emerald-400 h-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 pt-2 border-t border-white/20">
                    <div>
                        <span class="text-[11px] text-indigo-100 font-medium block">إجمالي المصروفات</span>
                        <p id="total-expenses" class="text-base font-black tracking-tight text-rose-200 mt-0.5">0 د.ع</p>
                    </div>
                    <div>
                        <span class="text-[11px] text-indigo-100 font-medium block">الديون (التي عليك)</span>
                        <p id="total-debts" class="text-base font-black tracking-tight text-amber-200 mt-0.5">0 د.ع</p>
                    </div>
                </div>
            </div>
        </section>

        <div class="bg-indigo-100/80 p-1.5 rounded-2xl flex gap-1 shadow-inner border border-indigo-200/60">
            <button type="button" onclick="switchTab('expenses')" id="tab-expenses" class="flex-1 py-3 text-xs font-bold rounded-xl bg-white text-indigo-600 shadow-sm transition-all duration-300 flex items-center justify-center gap-2 cursor-pointer">
                <span>💸</span> المصروفات
            </button>
            <button type="button" onclick="switchTab('debts')" id="tab-debts" class="flex-1 py-3 text-xs font-bold rounded-xl text-slate-600 hover:text-indigo-600 transition-all duration-300 flex items-center justify-center gap-2 cursor-pointer">
                <span>📑</span> الديون الذتية
            </button>
        </div>

        <div id="content-expenses" class="space-y-4">
            <div class="glass-card p-5 rounded-3xl shadow-sm">
                <h2 class="text-xs font-extrabold mb-4 text-indigo-900 flex items-center gap-2">
                    <span class="w-6 h-6 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center text-xs font-black">+</span> تسجيل مصروف جديد
                </h2>
                <form id="expense-form" onsubmit="addExpense(event)" class="space-y-3.5">
                    <div>
